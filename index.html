<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8" id="metaThemeColor">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>교무 대시보드</title>
<style>
  :root {
    --bg: #eef2f7;
    --card: #ffffff;
    --card-bd: #d5dde7;
    --sub: #f4f7fb;
    --text: #111827;
    --text-sub: #4b5563;
    --muted: #94a3b8;
    --accent: #1d4ed8;
    --accent-soft: #eff6ff;
    --danger: #dc2626;
    --sun: #dc2626;
    --sat: #1d4ed8;
    --cls1-bg: #bbf7d0; --cls1-fg: #14532d;
    --cls2-bg: #a5f3fc; --cls2-fg: #164e63;
    --cls3-bg: #bfdbfe; --cls3-fg: #1e3a8a;
    --ev-bg: #fef08a; --ev-fg: #854d0e;
    --doc-bg: #dcfce7; --doc-bd: #86efac; --doc-fg: #14532d;
    --warn-dot: #f97316;
    --tag-bg: #dbeafe; --tag-fg: #1e3a8a;
    --tag-done-bg: #f1f5f9; --tag-done-fg: #94a3b8;
    --nav-bg: #ffffff;
    --shadow: 0 2px 8px rgba(15,23,42,0.06);
  }
  body[data-theme="dark"] {
    --bg: #0f172a;
    --card: #1e293b;
    --card-bd: #334155;
    --sub: #0f172a;
    --text: #f1f5f9;
    --text-sub: #94a3b8;
    --muted: #64748b;
    --accent: #3b82f6;
    --accent-soft: #172554;
    --danger: #f87171;
    --sun: #f87171;
    --sat: #60a5fa;
    --cls1-bg: #14532d; --cls1-fg: #bbf7d0;
    --cls2-bg: #164e63; --cls2-fg: #a5f3fc;
    --cls3-bg: #1e3a8a; --cls3-fg: #bfdbfe;
    --ev-bg: #713f12; --ev-fg: #fef08a;
    --doc-bg: #064e3b; --doc-bd: #10b981; --doc-fg: #a7f3d0;
    --warn-dot: #fb923c;
    --tag-bg: #1e3a8a; --tag-fg: #dbeafe;
    --tag-done-bg: #0f172a; --tag-done-fg: #64748b;
    --nav-bg: #1e293b;
    --shadow: 0 2px 10px rgba(0,0,0,0.35);
  }
  body[data-theme="sage"] {
    --bg: #dfe8e0;
    --card: #fafbf9;
    --card-bd: #c2d0c3;
    --sub: #eef3ee;
    --text: #1c2b22;
    --text-sub: #4a5d50;
    --muted: #849689;
    --accent: #2d6a4f;
    --accent-soft: #e6f4ec;
    --danger: #c92a2a;
    --sun: #c92a2a;
    --sat: #2b6cb0;
    --cls1-bg: #c7ebd4; --cls1-fg: #14452f;
    --cls2-bg: #c5e8ee; --cls2-fg: #144a57;
    --cls3-bg: #d0e1f9; --cls3-fg: #1c3d6e;
    --ev-bg: #f8ebc1; --ev-fg: #7a4b06;
    --doc-bg: #d8f3dc; --doc-bd: #74c69d; --doc-fg: #1b4332;
    --warn-dot: #ea580c;
    --tag-bg: #d8eee1; --tag-fg: #1b4332;
    --tag-done-bg: #edf1ed; --tag-done-fg: #8c9c90;
    --nav-bg: #fafbf9;
    --shadow: 0 2px 8px rgba(28,43,34,0.06);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: -apple-system, 'Malgun Gothic', sans-serif; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); }

  .app { display: flex; flex-direction: column; height: 100dvh; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
    background: var(--card); border-bottom: 1px solid var(--card-bd);
    flex-shrink: 0;
  }
  .topbar-title { font-size: 19px; font-weight: 800; letter-spacing: -0.3px; }
  .sync-pill {
    font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 99px;
    background: var(--sub); color: var(--text-sub); border: 1px solid var(--card-bd);
    display: flex; align-items: center; gap: 5px; cursor: pointer;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: #22c55e; }
  .dot.loading { background: #f59e0b; }
  .dot.error { background: var(--danger); }

  .content { flex: 1; min-height: 0; position: relative; overflow: hidden; }
  .tab-pane { display: none; flex-direction: column; height: 100%; padding: 12px; overflow-y: auto; }
  .tab-pane.active { display: flex; }
  .tab-pane.no-scroll { overflow: hidden; padding: 8px 8px 6px; }

  .bottom-nav {
    display: grid; grid-template-columns: repeat(5, 1fr);
    background: var(--nav-bg); border-top: 1px solid var(--card-bd);
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
    flex-shrink: 0;
  }
  .nav-btn {
    border: none; background: transparent; color: var(--muted);
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 5px 0; border-radius: 10px; cursor: pointer; font-size: 11.5px; font-weight: 700;
  }
  .nav-btn .ico { font-size: 19px; line-height: 1; }
  .nav-btn.active { color: var(--accent); background: var(--accent-soft); }

  .week-bar {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--card); border: 1px solid var(--card-bd);
    border-radius: 12px; padding: 8px 10px; margin-bottom: 10px; flex-shrink: 0;
  }
  .week-title { font-size: 15px; font-weight: 800; }
  .nav-group { display: flex; gap: 6px; }
  .mini-btn {
    border: 1px solid var(--card-bd); background: var(--sub); color: var(--text);
    border-radius: 8px; padding: 5px 10px; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .mini-btn:active { opacity: 0.7; }

  .day-pills {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;
    margin-bottom: 10px; flex-shrink: 0;
  }
  .day-pill {
    border: 1px solid var(--card-bd); background: var(--card); color: var(--text-sub);
    border-radius: 11px; padding: 8px 2px; text-align: center; cursor: pointer;
    font-size: 13.5px; font-weight: 800;
  }
  .day-pill.today { border-color: var(--accent); color: var(--accent); }
  .day-pill.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* 1. 수업 탭 */
  .tt-list { display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .tt-row {
    display: flex; align-items: center; gap: 10px;
    background: var(--card); border: 1px solid var(--card-bd);
    border-radius: 13px; padding: 12px 14px; box-shadow: var(--shadow);
  }
  .tt-period {
    width: 48px; text-align: center; font-size: 13.5px; font-weight: 800;
    color: var(--text-sub); background: var(--sub); padding: 6px 0; border-radius: 8px; flex-shrink: 0;
  }
  .tt-body { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .cls-badge {
    font-size: 13px; font-weight: 800; padding: 4px 8px; border-radius: 7px;
    background: var(--sub); color: var(--text); flex-shrink: 0;
  }
  .cls-1 { background: var(--cls1-bg); color: var(--cls1-fg); }
  .cls-2 { background: var(--cls2-bg); color: var(--cls2-fg); }
  .cls-3 { background: var(--cls3-bg); color: var(--cls3-fg); }
  .tt-subject { font-size: 15.5px; font-weight: 700; word-break: keep-all; }
  .tt-event {
    background: var(--ev-bg); color: var(--ev-fg); padding: 5px 10px;
    border-radius: 8px; font-weight: 800; font-size: 14.5px; flex: 1;
  }
  .tt-empty { color: var(--muted); font-size: 14px; font-weight: 600; }

  /* 2. 출결 탭 */
  .att-meta-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 4px 6px; font-size: 12.5px; font-weight: 700; color: var(--text-sub); flex-shrink: 0;
  }
  .att-warn-badge { display: inline-flex; align-items: center; gap: 5px; color: var(--warn-dot); font-weight: 800; }
  .warn-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--warn-dot); display: inline-block; flex-shrink: 0; }
  .att-list { display: flex; flex-direction: column; gap: 7px; padding-bottom: 16px; }
  .att-row {
    display: grid; grid-template-columns: 62px 1fr 44px; align-items: center; gap: 8px;
    background: var(--card); border: 1px solid var(--card-bd);
    border-radius: 12px; padding: 8px 10px; box-shadow: var(--shadow);
  }
  .att-name { font-size: 15px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .att-reason-btn {
    width: 100%; min-height: 38px; border: 1px solid var(--card-bd); background: var(--sub);
    color: var(--text); border-radius: 9px; padding: 7px 10px; text-align: left;
    font-size: 14px; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
  }
  .att-reason-btn.empty { color: var(--muted); font-weight: 500; }
  .att-reason-btn.highlight { background: var(--doc-bg); border-color: var(--doc-bd); color: var(--doc-fg); }
  .att-reason-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .att-doc-wrap { display: flex; align-items: center; justify-content: center; }
  .att-doc-cb { width: 22px; height: 22px; accent-color: var(--accent); cursor: pointer; }

  /* 3. 풀스크린 달력 */
  .cal-top { display: flex; align-items: center; justify-content: space-between; padding: 4px 4px 8px; flex-shrink: 0; }
  .cal-title { font-size: 17px; font-weight: 800; }
  .cal-grid {
    display: grid; grid-template-columns: repeat(7, 1fr);
    grid-template-rows: 24px repeat(6, 1fr); gap: 3px; flex: 1; min-height: 0;
  }
  .cal-dow {
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 800; color: var(--text-sub);
    background: var(--card); border-radius: 6px;
  }
  .cal-dow.sun { color: var(--sun); }
  .cal-dow.sat { color: var(--sat); }
  .cal-cell {
    background: var(--card); border: 1px solid var(--card-bd); border-radius: 7px;
    padding: 2px 2px 3px; display: flex; flex-direction: column; overflow: hidden; cursor: pointer; min-height: 0;
  }
  .cal-cell.other { opacity: 0.4; }
  .cal-cell.today { border: 1.8px solid var(--accent); }
  .cal-num-row { display: flex; align-items: center; gap: 2px; margin-bottom: 2px; }
  .cal-num {
    font-size: 11.5px; font-weight: 800; width: 20px; height: 20px;
    display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; flex-shrink: 0;
  }
  .cal-cell.sun .cal-num, .cal-cell.holiday .cal-num { color: var(--sun); }
  .cal-cell.sat .cal-num { color: var(--sat); }
  .cal-cell.today .cal-num { background: var(--accent); color: #fff !important; }
  .cal-hol { font-size: 9.5px; color: var(--sun); font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cal-tag {
    font-size: 10px; font-weight: 700; background: var(--tag-bg); color: var(--tag-fg);
    border-radius: 3px; padding: 1px 3px; margin-top: 1.5px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.25;
  }
  .cal-tag.done { background: var(--tag-done-bg); color: var(--tag-done-fg); text-decoration: line-through; font-weight: 500; }

  /* 4. 메모 탭 */
  .folder-scroll { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; flex-shrink: 0; }
  .folder-pill {
    border: 1px solid var(--card-bd); background: var(--card); color: var(--text-sub);
    padding: 6px 13px; border-radius: 99px; font-size: 13.5px; font-weight: 800; white-space: nowrap; cursor: pointer;
  }
  .folder-pill.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .memo-cards { display: flex; flex-direction: column; gap: 9px; padding-bottom: 70px; }
  .memo-card {
    background: var(--card); border: 1px solid var(--card-bd); border-radius: 13px;
    padding: 13px 14px; box-shadow: var(--shadow); cursor: pointer;
  }
  .memo-card-title { font-size: 15.5px; font-weight: 800; margin-bottom: 4px; }
  .memo-card-preview {
    font-size: 13.5px; color: var(--text-sub); line-height: 1.45;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .memo-card-date { font-size: 11.5px; color: var(--muted); margin-top: 6px; }
  .fab {
    position: fixed; right: 18px; bottom: calc(76px + env(safe-area-inset-bottom));
    background: var(--accent); color: #fff; border: none; border-radius: 99px;
    padding: 12px 18px; font-size: 14.5px; font-weight: 800;
    box-shadow: 0 6px 16px rgba(0,0,0,0.22); cursor: pointer; z-index: 20;
  }

  /* 5. 시트 & 설정 탭 */
  .sheet-card {
    background: var(--card); border: 1px solid var(--card-bd); border-radius: 15px;
    padding: 15px; margin-bottom: 12px; box-shadow: var(--shadow);
  }
  .section-lbl { font-size: 13px; font-weight: 800; color: var(--text-sub); margin-bottom: 10px; }
  .sheet-launch-btn {
    width: 100%; border: 1px solid var(--card-bd); background: var(--sub); color: var(--text);
    border-radius: 12px; padding: 14px; margin-bottom: 9px; cursor: pointer;
    display: flex; align-items: center; gap: 12px; text-align: left;
  }
  .sheet-launch-btn:last-child { margin-bottom: 0; }
  .sheet-ico {
    width: 42px; height: 42px; border-radius: 11px; display: flex; align-items: center;
    justify-content: center; font-size: 21px; flex-shrink: 0;
  }
  .sheet-name { font-size: 15.5px; font-weight: 800; }
  .sheet-desc { font-size: 12.5px; color: var(--text-sub); margin-top: 2px; }
  .theme-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .theme-btn {
    border: 1.5px solid var(--card-bd); background: var(--sub); color: var(--text);
    border-radius: 10px; padding: 10px 4px; font-size: 13.5px; font-weight: 800; cursor: pointer;
  }
  .theme-btn.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .field-stack { display: flex; flex-direction: column; gap: 8px; }
  .field-lbl { font-size: 12.5px; font-weight: 700; color: var(--text-sub); margin-bottom: 3px; display: block; }

  /* 모달 공통 */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    display: none; align-items: center; justify-content: center; z-index: 100; padding: 14px;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: var(--card); color: var(--text); border: 1px solid var(--card-bd);
    border-radius: 18px; width: 100%; max-width: 440px; max-height: 88dvh;
    padding: 16px; display: flex; flex-direction: column; overflow-y: auto;
    box-shadow: 0 18px 40px rgba(0,0,0,0.35);
  }
  .modal-head {
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 10px; margin-bottom: 12px; border-bottom: 1px solid var(--card-bd);
  }
  .modal-head h3 { font-size: 17px; font-weight: 800; }
  .close-x { border: none; background: transparent; color: var(--muted); font-size: 24px; cursor: pointer; padding: 0 4px; }

  .todo-add-row { display: flex; gap: 6px; margin-bottom: 10px; }
  .txt-input {
    width: 100%; border: 1.5px solid var(--card-bd); background: var(--sub); color: var(--text);
    border-radius: 10px; padding: 9px 11px; font-size: 15px; outline: none;
  }
  .txt-input:focus { border-color: var(--accent); }
  .btn-primary {
    border: none; background: var(--accent); color: #fff; border-radius: 10px;
    padding: 10px 14px; font-size: 14.5px; font-weight: 800; cursor: pointer; white-space: nowrap;
  }
  .btn-ghost {
    border: 1px solid var(--card-bd); background: var(--sub); color: var(--text);
    border-radius: 10px; padding: 10px 13px; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .todo-items { display: flex; flex-direction: column; gap: 7px; max-height: 50dvh; overflow-y: auto; }
  .todo-row {
    display: flex; align-items: center; gap: 8px;
    background: var(--sub); border: 1px solid var(--card-bd);
    border-radius: 10px; padding: 9px 10px;
  }
  .todo-row input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); flex-shrink: 0; }
  .todo-row-txt { flex: 1; font-size: 15px; font-weight: 700; line-height: 1.35; word-break: break-all; }
  .todo-row.done .todo-row-txt { text-decoration: line-through; color: var(--muted); font-weight: 500; }
  .icon-act { border: none; background: transparent; color: var(--muted); font-size: 17px; cursor: pointer; padding: 2px 5px; }

  /* 출결 조합 팝업 */
  .grp-label { font-size: 12.5px; font-weight: 800; color: var(--text-sub); margin: 10px 0 6px; }
  .grp-label:first-of-type { margin-top: 0; }
  .pill-grid { display: flex; flex-wrap: wrap; gap: 6px; }
  .sel-pill {
    border: 1.5px solid var(--card-bd); background: var(--sub); color: var(--text);
    border-radius: 9px; padding: 7px 11px; font-size: 13.5px; font-weight: 700; cursor: pointer;
  }
  .sel-pill.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .preview-box {
    margin-top: 10px; padding: 8px 10px; border-radius: 9px;
    background: var(--accent-soft); color: var(--accent);
    font-size: 13.5px; font-weight: 800; min-height: 36px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .final-area {
    width: 100%; border: 1.5px solid var(--card-bd); background: var(--sub); color: var(--text);
    border-radius: 10px; padding: 9px 11px; font-size: 14.5px; font-weight: 700;
    resize: none; outline: none; margin-top: 4px;
  }
  .doc-check-bar {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 10px; padding: 10px 12px; border-radius: 10px;
    background: var(--sub); border: 1px solid var(--card-bd); font-size: 14.5px; font-weight: 800;
  }
  .modal-foot { display: flex; gap: 8px; margin-top: 12px; }
  .memo-area {
    width: 100%; height: 240px; border: 1.5px solid var(--card-bd); background: var(--sub);
    color: var(--text); border-radius: 10px; padding: 11px; font-size: 15px; line-height: 1.55;
    resize: none; outline: none; margin-top: 8px;
  }
  .empty-box { text-align: center; color: var(--muted); padding: 36px 12px; font-size: 14.5px; font-weight: 600; }
</style>
</head>
<body data-theme="light">
<div class="app">
  <div class="topbar">
    <div class="topbar-title" id="topTitle">오늘 수업</div>
    <button class="sync-pill" onclick="syncAll()">
      <span class="dot" id="syncDot"></span>
      <span id="syncText">동기화</span>
    </button>
  </div>

  <div class="content">
    <!-- 1. 수업 탭 -->
    <section class="tab-pane active" id="tab-timetable">
      <div class="week-bar">
        <div class="week-title" id="ttWeekLabel">이번 주</div>
        <div class="nav-group">
          <button class="mini-btn" onclick="moveTtWeek(-1)">◀</button>
          <button class="mini-btn" onclick="moveTtWeek(0, true)">오늘</button>
          <button class="mini-btn" onclick="moveTtWeek(1)">▶</button>
        </div>
      </div>
      <div class="day-pills" id="ttDayPills"></div>
      <div class="tt-list" id="ttList"></div>
    </section>

    <!-- 2. 출결 탭 -->
    <section class="tab-pane" id="tab-attendance">
      <div class="week-bar">
        <div class="week-title" id="attWeekLabel">이번 주</div>
        <div class="nav-group">
          <button class="mini-btn" onclick="moveAttWeek(-1)">◀</button>
          <button class="mini-btn" onclick="moveAttWeek(0, true)">오늘</button>
          <button class="mini-btn" onclick="moveAttWeek(1)">▶</button>
        </div>
      </div>
      <div class="day-pills" id="attDayPills"></div>
      <div class="att-meta-row">
        <span>이름 · 출결 사유 (터치하여 입력)</span>
        <span id="attMissingCount"></span>
      </div>
      <div class="att-list" id="attList"></div>
    </section>

    <!-- 3. 달력 탭 -->
    <section class="tab-pane no-scroll" id="tab-calendar">
      <div class="cal-top">
        <div class="cal-title" id="calTitle">2026년 11월</div>
        <div class="nav-group">
          <button class="mini-btn" onclick="moveMonth(-1)">◀</button>
          <button class="mini-btn" onclick="goTodayCal()">오늘</button>
          <button class="mini-btn" onclick="moveMonth(1)">▶</button>
        </div>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </section>

    <!-- 4. 메모 탭 -->
    <section class="tab-pane" id="tab-memo">
      <div class="folder-scroll" id="folderBar"></div>
      <div class="memo-cards" id="memoCards"></div>
      <button class="fab" onclick="addNewMemo()">+ 새 메모</button>

<script>
const STORAGE_CACHE = "teacher_pwa_cache_v2";
const STORAGE_API = "teacher_pwa_api_url_v2";
const STORAGE_PIN = "teacher_pwa_api_pin_v2";
const STORAGE_THEME = "teacher_pwa_theme_v2";

const CAT1_LIST = ["출석인정", "질병", "미인정", "기타"];
const CAT2_LIST = ["결석", "지각", "조퇴", "결과"];
const PERIOD_LIST = ["조회", "1교시", "2교시", "3교시", "4교시", "5교시", "6교시", "7교시", "종례"];
const DOW_KO = ["월", "화", "수", "목", "금"];
const TAB_TITLES = {
  timetable: "오늘 수업",
  attendance: "출결 관리",
  calendar: "월간 달력",
  memo: "폴더형 메모장",
  sheets: "시트 · 설정"
};

function fmtDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function getTargetMondayStr(offset = 0) {
  const now = new Date();
  const base = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const dow = base.getDay();
  if (dow === 6) base.setDate(base.getDate() + 2);
  else if (dow === 0) base.setDate(base.getDate() + 1);
  else base.setDate(base.getDate() - (dow - 1));
  base.setDate(base.getDate() + offset * 7);
  return fmtDate(base);
}
function getDefaultDayIdx() {
  const dow = new Date().getDay();
  return (dow >= 1 && dow <= 5) ? dow - 1 : 0;
}
function esc(s) {
  return String(s || "").replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
}
function needsDocHighlight(text) {
  if (!text) return false;
  if (text.includes("미인정")) return false;
  return text.includes("결석") || text.includes("인정") || text.includes("생리");
}

let apiUrl = localStorage.getItem(STORAGE_API) || "";
let apiPin = localStorage.getItem(STORAGE_PIN) || "";
let cache = { todos: [], memos: [], holidays: {}, timetables: {}, attendance: {}, urls: {} };
try {
  const saved = localStorage.getItem(STORAGE_CACHE);
  if (saved) cache = Object.assign(cache, JSON.parse(saved));
} catch (_) {}

let currentTab = "timetable";
let ttWeekOffset = 0;
let ttDayIdx = getDefaultDayIdx();

let attWeekOffset = 0;
let attDayIdx = getDefaultDayIdx();
let attEditTarget = null;
let bCat1 = "";
let bCat2 = "";
let bPeriods = [];

const nowObj = new Date();
let calYear = nowObj.getFullYear();
let calMonth = nowObj.getMonth();
let selectedCalDate = fmtDate(nowObj);

let customFolders = ["업무", "학급"];
let selectedFolder = "업무";
let editingMemoId = null;

function saveLocalCache() {
  try { localStorage.setItem(STORAGE_CACHE, JSON.stringify(cache)); } catch (_) {}
}
function setSyncUI(state, text) {
  document.getElementById("syncDot").className = "dot " + state;
  document.getElementById("syncText").textContent = text;
}
function setTheme(theme) {
  const t = ["light", "dark", "sage"].includes(theme) ? theme : "light";
  document.body.setAttribute("data-theme", t);
  localStorage.setItem(STORAGE_THEME, t);
  const colors = { light: "#1d4ed8", dark: "#0f172a", sage: "#2d6a4f" };
  document.getElementById("metaThemeColor").setAttribute("content", colors[t]);
  ["light", "dark", "sage"].forEach(k => {
    const el = document.getElementById("th-" + k);
    if (el) el.classList.toggle("active", k === t);
  });
}
function switchTab(tab) {
  currentTab = tab;
  document.getElementById("topTitle").textContent = TAB_TITLES[tab] || "교무 대시보드";
  document.querySelectorAll(".tab-pane").forEach(p => p.classList.remove("active"));
  document.getElementById("tab-" + tab).classList.add("active");
  document.querySelectorAll(".nav-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  renderAll();
}
function closeModal(id) {
  document.getElementById(id).classList.remove("open");
}
function hasValidAuth() {
  return apiUrl.startsWith("https://script.google.com/") && apiPin.length > 0;
}

function saveAuthFromModal() {
  const u = document.getElementById("initUrlInput").value.trim();
  const p = document.getElementById("initPinInput").value.trim();
  if (!u.startsWith("https://script.google.com/")) {
    alert("올바른 Apps Script 웹 앱 URL을 입력해 주세요.");
    return;
  }
  if (!p) {
    alert("비밀번호(PIN)를 입력해 주세요.");
    return;
  }
  apiUrl = u;
  apiPin = p;
  localStorage.setItem(STORAGE_API, apiUrl);
  localStorage.setItem(STORAGE_PIN, apiPin);
  document.getElementById("apiUrlInput").value = apiUrl;
  document.getElementById("apiPinInput").value = apiPin;
  closeModal("authModal");
  syncAll();
}

function saveAuthFromSettings() {
  const u = document.getElementById("apiUrlInput").value.trim();
  const p = document.getElementById("apiPinInput").value.trim();
  if (!u.startsWith("https://script.google.com/") || !p) {
    alert("웹 앱 URL과 비밀번호를 모두 입력해 주세요.");
    return;
  }
  apiUrl = u;
  apiPin = p;
  localStorage.setItem(STORAGE_API, apiUrl);
  localStorage.setItem(STORAGE_PIN, apiPin);
  syncAll();
}

function logoutDevice() {
  if (!confirm("이 기기에 저장된 주소·비밀번호와 캐시를 모두 삭제할까요?")) return;
  localStorage.removeItem(STORAGE_API);
  localStorage.removeItem(STORAGE_PIN);
  localStorage.removeItem(STORAGE_CACHE);
  apiUrl = "";
  apiPin = "";
  cache = { todos: [], memos: [], holidays: {}, timetables: {}, attendance: {}, urls: {} };
  document.getElementById("apiUrlInput").value = "";
  document.getElementById("apiPinInput").value = "";
  renderAll();
  document.getElementById("authModal").classList.add("open");
}

async function syncAll() {
  if (!hasValidAuth()) {
    setSyncUI("error", "연결 필요");
    document.getElementById("authModal").classList.add("open");
    return;
  }
  setSyncUI("loading", "동기화 중...");
  try {
    const res = await fetch(apiUrl, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "sync", pin: apiPin })
    });
    const data = await res.json();
    if (!data.ok) {
      setSyncUI("error", data.error || "인증 실패");
      if ((data.error || "").includes("비밀번호")) {
        alert("비밀번호가 일치하지 않습니다. [시트] 탭에서 다시 확인해 주세요.");
      }
      return;
    }
    cache = {
      todos: data.todos || [],
      memos: data.memos || [],
      holidays: data.holidays || {},
      timetables: data.timetables || {},
      attendance: data.attendance || {},
      urls: data.urls || {}
    };
    saveLocalCache();
    renderAll();
    const n = new Date();
    setSyncUI("ok", `${String(n.getHours()).padStart(2,"0")}:${String(n.getMinutes()).padStart(2,"0")}`);
  } catch (err) {
    setSyncUI("error", "연결 실패");
  }
}

async function postAction(payload, okText = "저장됨") {
  if (!hasValidAuth()) return;
  setSyncUI("loading", "저장 중...");
  try {
    const res = await fetch(apiUrl, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(Object.assign({}, payload, { pin: apiPin }))
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || "저장 실패");
    setSyncUI("ok", okText);
  } catch (err) {
    setSyncUI("error", "저장 실패");
  }
}

function renderAll() {
  renderTimetable();
  renderAttendance();
  renderCalendar();
  renderMemos();
}

/* 1. 오늘 수업 */
function moveTtWeek(delta, reset = false) {
  if (reset) { ttWeekOffset = 0; ttDayIdx = getDefaultDayIdx(); }
  else ttWeekOffset += delta;
  renderTimetable();
}
function badgeClass(clsStr) {
  if (clsStr.startsWith("1-")) return "cls-1";
  if (clsStr.startsWith("2-")) return "cls-2";
  if (clsStr.startsWith("3-")) return "cls-3";
  return "";
}
function renderTimetable() {
  const monKey = getTargetMondayStr(ttWeekOffset);
  const tt = (cache.timetables || {})[monKey];
  const todayStr = fmtDate(new Date());
  const dates = tt ? tt.dates : Array.from({ length: 5 }, (_, d) => {
    const dt = new Date(monKey + "T00:00:00");
    dt.setDate(dt.getDate() + d);
    return fmtDate(dt);
  });

  document.getElementById("ttWeekLabel").textContent = `${dates[0].slice(5)} ~ ${dates[4].slice(5)}`;
  document.getElementById("ttDayPills").innerHTML = dates.map((dt, d) => {
    const isToday = dt === todayStr;
    const isAct = d === ttDayIdx;
    return `<button class="day-pill ${isToday ? "today" : ""} ${isAct ? "active" : ""}" onclick="ttDayIdx=${d};renderTimetable();">${DOW_KO[d]}(${Number(dt.slice(8))})</button>`;
  }).join("");

  const listEl = document.getElementById("ttList");
  if (!tt) {
    listEl.innerHTML = `<div class="empty-box">${monKey} 주간 시간표가 없습니다.</div>`;
    return;
  }
  const labels = ["1교시", "2교시", "3교시", "4교시", "5교시", "6교시", "7교시", "기타"];
  listEl.innerHTML = tt.rows.map((dayCells, rIdx) => {
    const cell = dayCells[ttDayIdx] || { cls: "", text: "" };
    let bodyHtml = `<span class="tt-empty">공강</span>`;
    if (cell.cls && cell.text) {
      bodyHtml = `<span class="cls-badge ${badgeClass(cell.cls)}">${esc(cell.cls)}</span><span class="tt-subject">${esc(cell.text)}</span>`;
    } else if (cell.cls) {
      bodyHtml = `<span class="cls-badge ${badgeClass(cell.cls)}">${esc(cell.cls)}</span>`;
    } else if (cell.text) {
      bodyHtml = `<div class="tt-event">${esc(cell.text)}</div>`;
    }
    return `<div class="tt-row"><div class="tt-period">${labels[rIdx]}</div><div class="tt-body">${bodyHtml}</div></div>`;
  }).join("");
}

/* 2. 출결 관리 */
function moveAttWeek(delta, reset = false) {
  if (reset) { attWeekOffset = 0; attDayIdx = getDefaultDayIdx(); }
  else attWeekOffset += delta;
  renderAttendance();
}
function renderAttendance() {
  const monKey = getTargetMondayStr(attWeekOffset);
  const weekObj = (cache.attendance || {})[monKey];
  const todayStr = fmtDate(new Date());
  const dates = weekObj ? weekObj.dates : Array.from({ length: 5 }, (_, d) => {
    const dt = new Date(monKey + "T00:00:00");
    dt.setDate(dt.getDate() + d);
    return fmtDate(dt);
  });

  document.getElementById("attWeekLabel").textContent = `${dates[0].slice(5)} ~ ${dates[4].slice(5)}`;
  document.getElementById("attDayPills").innerHTML = dates.map((dt, d) => {
    const isToday = dt === todayStr;
    const isAct = d === attDayIdx;
    return `<button class="day-pill ${isToday ? "today" : ""} ${isAct ? "active" : ""}" onclick="attDayIdx=${d};renderAttendance();">${DOW_KO[d]}(${Number(dt.slice(8))})</button>`;
  }).join("");

  const listEl = document.getElementById("attList");
  const missEl = document.getElementById("attMissingCount");
  if (!weekObj || !weekObj.students || weekObj.students.length === 0) {
    missEl.innerHTML = "";
    listEl.innerHTML = `<div class="empty-box">${monKey} 주간 출결 데이터가 없습니다.</div>`;
    return;
  }

  let missingCount = 0;
  listEl.innerHTML = weekObj.students.map((st, idx) => {
    const cell = st.d[attDayIdx] || ["", false];
    const reason = cell[0] || "";
    const doc = Boolean(cell[1]);
    const isHi = needsDocHighlight(reason);
    const isMissingDoc = isHi && !doc;
    if (isMissingDoc) missingCount++;

    return `
      <div class="att-row">
        <div class="att-name">${esc(st.n)}</div>
        <button class="att-reason-btn ${reason ? "" : "empty"} ${isHi ? "highlight" : ""}" onclick="openAttModal('${monKey}', ${idx})">
          <span class="att-reason-text">${reason ? esc(reason) : "출결 입력"}</span>
          ${isMissingDoc ? '<span class="warn-dot" title="서류 미제출"></span>' : ""}
        </button>
        <div class="att-doc-wrap">
          <input type="checkbox" class="att-doc-cb" ${doc ? "checked" : ""} onchange="toggleAttDoc('${monKey}', ${idx}, this.checked)">
        </div>
      </div>`;
  }).join("");

  missEl.innerHTML = missingCount > 0
    ? `<span class="att-warn-badge"><span class="warn-dot"></span>서류 미제출 ${missingCount}명</span>`
    : `<span style="color:var(--muted);">서류</span>`;
}
function toggleAttDoc(monKey, studentIdx, checked) {
  const st = cache.attendance[monKey].students[studentIdx];
  st.d[attDayIdx][1] = Boolean(checked);
  saveLocalCache();
  renderAttendance();
  postAction({ action: "att_save", row: st.r, dayIndex: attDayIdx, doc: Boolean(checked) }, "서류 반영");
}
function openAttModal(monKey, studentIdx) {
  const weekObj = cache.attendance[monKey];
  const st = weekObj.students[studentIdx];
  const dateStr = weekObj.dates[attDayIdx] || "";
  attEditTarget = { monKey, studentIdx, row: st.r, name: st.n, dayIdx: attDayIdx, date: dateStr };

  document.getElementById("attModalTitle").textContent = `${st.n} · ${dateStr.slice(5)} (${DOW_KO[attDayIdx]})`;
  document.getElementById("attFinalText").value = st.d[attDayIdx][0] || "";
  document.getElementById("attDocCheck").checked = Boolean(st.d[attDayIdx][1]);
  resetAttBuilder();
  document.getElementById("attModal").classList.add("open");
}
function resetAttBuilder() {
  bCat1 = ""; bCat2 = ""; bPeriods = [];
  document.getElementById("attNoteInput").value = "";
  renderAttBuilderPills();
  updateAttPreview();
}
function renderAttBuilderPills() {
  document.getElementById("cat1Pills").innerHTML = CAT1_LIST.map(c =>
    `<button class="sel-pill ${bCat1 === c ? "on" : ""}" onclick="bCat1=(bCat1==='${c}'?'':'${c}');renderAttBuilderPills();updateAttPreview();">${c}</button>`
  ).join("");
  document.getElementById("cat2Pills").innerHTML = CAT2_LIST.map(c =>
    `<button class="sel-pill ${bCat2 === c ? "on" : ""}" onclick="selectCat2('${c}')">${c}</button>`
  ).join("");
  const pSec = document.getElementById("periodSection");
  if (!bCat2 || bCat2 === "결석") {
    pSec.style.display = "none";
  } else {
    pSec.style.display = "block";
    document.getElementById("periodLabel").textContent = bCat2 === "결과" ? "교시 선택 (중복 선택 가능)" : "교시 선택";
    document.getElementById("periodPills").innerHTML = PERIOD_LIST.map(p =>
      `<button class="sel-pill ${bPeriods.includes(p) ? "on" : ""}" onclick="togglePeriod('${p}')">${p}</button>`
    ).join("");
  }
}
function selectCat2(c) {
  bCat2 = (bCat2 === c) ? "" : c;
  if (!bCat2 || bCat2 === "결석") bPeriods = [];
  else if (bCat2 !== "결과" && bPeriods.length > 1) bPeriods = [bPeriods[0]];
  renderAttBuilderPills();
  updateAttPreview();
}
function togglePeriod(p) {
  if (bCat2 === "결과") {
    if (bPeriods.includes(p)) bPeriods = bPeriods.filter(x => x !== p);
    else bPeriods.push(p);
    bPeriods.sort((a, b) => PERIOD_LIST.indexOf(a) - PERIOD_LIST.indexOf(b));
  } else {
    bPeriods = (bPeriods[0] === p) ? [] : [p];
  }
  renderAttBuilderPills();
  updateAttPreview();
}
function formatPeriodsText(arr) {
  if (!arr || arr.length === 0) return "";
  if (arr.length > 1 && arr.every(x => x.endsWith("교시"))) {
    return arr.map(x => x.replace("교시", "")).join(", ") + "교시";
  }
  return arr.join(", ");
}
function buildAttPiece() {
  const note = document.getElementById("attNoteInput").value.trim();
  const pStr = formatPeriodsText(bPeriods);
  if (!bCat1 && !bCat2 && !note && !pStr) return "";
  const head = [bCat1, bCat2].filter(Boolean).join(" ");
  if (bCat2 === "결과") {
    if (!bCat1 && !note && pStr) return `결과 ${pStr}`;
    return [head, note, pStr].filter(Boolean).join(", ");
  }
  if (bCat2 === "지각") return [head, note, pStr ? `${pStr}에 옴.` : ""].filter(Boolean).join(", ");
  if (bCat2 === "조퇴") return [head, note, pStr ? `${pStr}에 감.` : ""].filter(Boolean).join(", ");
  return [head, note].filter(Boolean).join(", ");
}
function updateAttPreview() {
  document.getElementById("attPreviewText").textContent = buildAttPiece() || "위 항목을 선택하세요";
}
function appendCurrentPiece() {
  const piece = buildAttPiece();
  if (!piece) return;
  const area = document.getElementById("attFinalText");
  const prev = area.value.trim();
  area.value = prev ? `${prev}, ${piece}` : piece;
  resetAttBuilder();
}
function clearAttAll() {
  document.getElementById("attFinalText").value = "";
  resetAttBuilder();
}
function saveAttModal() {
  if (!attEditTarget) return;
  const pending = buildAttPiece();
  const area = document.getElementById("attFinalText");
  let finalText = area.value.trim();
  if (pending) finalText = finalText ? `${finalText}, ${pending}` : pending;
  const doc = document.getElementById("attDocCheck").checked;
  const { monKey, studentIdx, row, dayIdx } = attEditTarget;
  cache.attendance[monKey].students[studentIdx].d[dayIdx] = [finalText, doc];
  saveLocalCache();
  closeModal("attModal");
  renderAttendance();
  postAction({ action: "att_save", row, dayIndex: dayIdx, reason: finalText, doc }, "출결 저장됨");
}

/* 3. 월간 달력 + 할 일 팝업 */
function moveMonth(delta) {
  calMonth += delta;
  if (calMonth < 0) { calMonth = 11; calYear--; }
  if (calMonth > 11) { calMonth = 0; calYear++; }
  renderCalendar();
}
function goTodayCal() {
  const n = new Date();
  calYear = n.getFullYear(); calMonth = n.getMonth(); selectedCalDate = fmtDate(n);
  renderCalendar();
}
function renderCalendar() {
  document.getElementById("calTitle").textContent = `${calYear}년 ${calMonth + 1}월`;
  const grid = document.getElementById("calGrid");
  const dows = ["일", "월", "화", "수", "목", "금", "토"];
  let html = dows.map((d, i) => `<div class="cal-dow ${i===0?"sun":""} ${i===6?"sat":""}">${d}</div>`).join("");
  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const start = new Date(calYear, calMonth, 1 - firstDay);
  const todayStr = fmtDate(new Date());
  const holidays = cache.holidays || {};

  for (let i = 0; i < 42; i++) {
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    const key = fmtDate(d);
    const dow = d.getDay();
    const hol = holidays[key] || "";
    const cls = [
      "cal-cell",
      d.getMonth() !== calMonth ? "other" : "",
      dow === 0 ? "sun" : "",
      dow === 6 ? "sat" : "",
      hol ? "holiday" : "",
      key === todayStr ? "today" : ""
    ].filter(Boolean).join(" ");

    const dayTodos = (cache.todos || []).filter(t => t.date === key).slice(0, 4);
    const tagsHtml = dayTodos.map(t => `<div class="cal-tag ${t.done ? "done" : ""}">${esc(t.text)}</div>`).join("");
    html += `
      <div class="${cls}" onclick="openTodoModal('${key}')">
        <div class="cal-num-row">
          <div class="cal-num">${d.getDate()}</div>
          ${hol ? `<span class="cal-hol">${esc(hol)}</span>` : ""}
        </div>
        ${tagsHtml}
      </div>`;
  }
  grid.innerHTML = html;
}
function openTodoModal(dateKey) {
  selectedCalDate = dateKey;
  renderTodoModal();
  document.getElementById("todoModal").classList.add("open");
}
function renderTodoModal() {
  const hol = (cache.holidays || {})[selectedCalDate];
  const items = (cache.todos || []).filter(t => t.date === selectedCalDate);
  const remain = items.filter(t => !t.done).length;
  document.getElementById("todoModalTitle").textContent = `${selectedCalDate.slice(5)}${hol ? " · " + hol : ""} (${remain}개 남음)`;
  const listEl = document.getElementById("todoModalList");
  if (items.length === 0) {
    listEl.innerHTML = `<div class="empty-box" style="padding:24px 0;">등록된 할 일이 없습니다.</div>`;
    return;
  }
  listEl.innerHTML = items.map(item => `
    <div class="todo-row ${item.done ? "done" : ""}">
      <input type="checkbox" ${item.done ? "checked" : ""} onchange="toggleTodo('${item.id}')">
      <div class="todo-row-txt" onclick="toggleTodo('${item.id}')">${esc(item.text)}</div>
      <button class="icon-act" onclick="editTodo('${item.id}')">✎</button>
      <button class="icon-act" style="color:var(--danger);font-size:20px;" onclick="deleteTodo('${item.id}')">×</button>
    </div>`).join("");
}
function addTodo() {
  const inp = document.getElementById("todoInput");
  const text = inp.value.trim();
  if (!text) return;
  const item = { id: String(Date.now()), date: selectedCalDate, text, done: false };
  cache.todos.push(item);
  inp.value = "";
  saveLocalCache(); renderCalendar(); renderTodoModal();
  postAction({ action: "todo_add", item }, "할 일 추가");
}
function toggleTodo(id) {
  const t = cache.todos.find(x => String(x.id) === String(id));
  if (!t) return;
  t.done = !t.done;
  saveLocalCache(); renderCalendar(); renderTodoModal();
  postAction({ action: "todo_toggle", id: String(id), done: t.done }, "상태 반영");
}
function editTodo(id) {
  const t = cache.todos.find(x => String(x.id) === String(id));
  if (!t) return;
  const next = prompt("할 일 수정:", t.text);
  if (next === null || !next.trim() || next.trim() === t.text) return;
  t.text = next.trim();
  saveLocalCache(); renderCalendar(); renderTodoModal();
  postAction({ action: "todo_edit", id: String(id), text: t.text }, "수정됨");
}
function deleteTodo(id) {
  cache.todos = cache.todos.filter(x => String(x.id) !== String(id));
  saveLocalCache(); renderCalendar(); renderTodoModal();
  postAction({ action: "todo_delete", id: String(id) }, "삭제됨");
}

/* 4. 폴더형 메모장 */
function getFolders() {
  const set = new Set(customFolders);
  (cache.memos || []).forEach(m => { if (m.folder) set.add(m.folder); });
  return Array.from(set);
}
function selectFolderByIndex(idx) {
  const folders = getFolders();
  if (folders[idx]) { selectedFolder = folders[idx]; renderMemos(); }
}
function renderMemos() {
  const folders = getFolders();
  if (!folders.includes(selectedFolder)) selectedFolder = folders[0] || "업무";
  document.getElementById("folderBar").innerHTML = folders.map((f, idx) =>
    `<button class="folder-pill ${f === selectedFolder ? "active" : ""}" onclick="selectFolderByIndex(${idx})">${esc(f)}</button>`
  ).join("") + `<button class="folder-pill" onclick="addMemoFolder()">+ 폴더</button>`;

  const inFolder = (cache.memos || []).filter(m => m.folder === selectedFolder);
  const wrap = document.getElementById("memoCards");
  if (inFolder.length === 0) {
    wrap.innerHTML = `<div class="empty-box">이 폴더에 메모가 없습니다.<br>아래 [+ 새 메모]를 눌러 작성하세요.</div>`;
    return;
  }
  wrap.innerHTML = inFolder.map(m => `
    <div class="memo-card" onclick="openMemoModal('${m.id}')">
      <div class="memo-card-title">${esc(m.title || "(제목 없음)")}</div>
      <div class="memo-card-preview">${esc(m.content || "내용 없음")}</div>
      <div class="memo-card-date">${esc(m.updated || "")}</div>
    </div>`).join("");
}
function addMemoFolder() {
  const name = prompt("새 폴더 이름:");
  if (!name || !name.trim()) return;
  const f = name.trim();
  if (!customFolders.includes(f)) customFolders.push(f);
  selectedFolder = f;
  renderMemos();
}
function addNewMemo() {
  editingMemoId = null;
  document.getElementById("memoModalHead").textContent = `새 메모 (${selectedFolder})`;
  document.getElementById("memoTitleInput").value = "";
  document.getElementById("memoBodyInput").value = "";
  document.getElementById("memoModal").classList.add("open");
}
function openMemoModal(id) {
  const m = cache.memos.find(x => String(x.id) === String(id));
  if (!m) return;
  editingMemoId = String(m.id);
  document.getElementById("memoModalHead").textContent = `메모 수정 (${m.folder})`;
  document.getElementById("memoTitleInput").value = m.title || "";
  document.getElementById("memoBodyInput").value = m.content || "";
  document.getElementById("memoModal").classList.add("open");
}
function saveCurrentMemo() {
  const title = document.getElementById("memoTitleInput").value.trim() || "새 메모";
  const content = document.getElementById("memoBodyInput").value;
  const updated = fmtDate(new Date());
  let memo;
  if (editingMemoId) {
    memo = cache.memos.find(x => String(x.id) === editingMemoId);
    if (memo) { memo.title = title; memo.content = content; memo.updated = updated; }
  }
  if (!memo) {
    memo = { id: String(Date.now()), folder: selectedFolder, title, content, updated };
    cache.memos.push(memo);
  }
  saveLocalCache(); closeModal("memoModal"); renderMemos();
  postAction({ action: "memo_save", memo }, "메모 저장됨");
}
function deleteCurrentMemo() {
  if (!editingMemoId) { closeModal("memoModal"); return; }
  if (!confirm("이 메모를 삭제할까요?")) return;
  const delId = editingMemoId;
  cache.memos = cache.memos.filter(x => String(x.id) !== delId);
  saveLocalCache(); closeModal("memoModal"); renderMemos();
  postAction({ action: "memo_delete", id: delId }, "메모 삭제됨");
}

/* 5. Google Sheets 앱 실행 */
function openSheetApp(key) {
  const url = (cache.urls || {})[key];
  if (!url) { alert("먼저 [동기화]를 완료해 주세요."); return; }
  if (/Android/i.test(navigator.userAgent)) {
    const clean = url.replace(/^https?:\/\//, "");
    window.location.href = `intent://${clean}#Intent;scheme=https;package=com.google.android.apps.docs.editors.sheets;S.browser_fallback_url=${encodeURIComponent(url)};end`;
  } else {
    window.open(url, "_blank");
  }
}

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch(() => {});
}
setTheme(localStorage.getItem(STORAGE_THEME) || "light");
document.getElementById("apiUrlInput").value = apiUrl;
document.getElementById("apiPinInput").value = apiPin;
renderAll();
if (hasValidAuth()) {
  syncAll();
} else {
  document.getElementById("authModal").classList.add("open");
}
